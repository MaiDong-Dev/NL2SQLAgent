[project]
name = "data-agent"
version = "0.1.0"
description = "NL2SQL RAG Agent：基于 LangGraph 的元数据增强 Text-to-SQL 问数系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.11",
    "cryptography>=46.0.4",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.128.0",
    "huggingface-hub>=0.36.0",
    "jieba>=0.42.1",
    "langchain>=1.2.7",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.0",
    "langgraph>=1.0.7",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.16.2",
    "ragas>=0.4.3",
    "sqlalchemy>=2.0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: 需要真实中间件（MySQL / ES / Qdrant / Embedding）的集成测试",
]

# =============================================================================
# ruff：lint + format
#   uv run ruff check --fix     # 自动修可修的（未使用导入、导入顺序等）
#   uv run ruff format          # 统一排版
# =============================================================================
[tool.ruff]
# 行宽取 120 而非默认 88：本仓注释以中文为主，ruff 按**字符数**计长，
# 中文一句 40 字就接近 88 了，用默认值会产生大量无意义的 E501。
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "frontend",           # 前端由 Vite/ESLint 负责
    ".codebuddy",
    "eval/archive",       # 归档的历史评测产物
    "docs/tutorial/单元代码学习示例",  # 学习示例，非项目代码
]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · UP pyupgrade
# 暂不启用 B(bugbear) / SIM(simplify)：会引入大量非规范性问题，
# 待本仓风格收敛后再单独评估（见 docs/开发约定.md）
select = ["E", "W", "F", "I", "UP"]
# E501 交给 ruff format；中文注释按字符计长必然误报
ignore = ["E501"]

[tool.ruff.lint.isort]
# 内部包单独分组，与第三方隔开，便于扫读依赖来源
known-first-party = ["server", "meta_builder", "eval", "scripts"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
