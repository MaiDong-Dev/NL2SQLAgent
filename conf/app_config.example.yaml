# 配置模板：复制为 conf/app_config.yaml 后填入自己的环境。
# 数据库密码、API Key 一律走环境变量，不写进文件（避免密钥入库）。
#
# 需要设置的环境变量：
#   MYSQL_PASSWORD       MySQL（meta / dw 库）登录密码
#   DEEPSEEK_API_KEY     业务链路与 ragas 裁判 LLM 的 Key
#   OPENROUTER_API_KEY   评测裁判 Jev 的 Key（--judge jev / both 时用）
# Windows: setx MYSQL_PASSWORD xxx    Linux/macOS: export MYSQL_PASSWORD=xxx
# 也可以直接写到项目根目录 .env（已被 .gitignore 忽略）

logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: <your-mysql-host>
  port: 3306
  user: <your-mysql-user>
  password: ${oc.env:MYSQL_PASSWORD,''}
  database: meta

db_dw:
  host: <your-mysql-host>
  port: 3306
  user: <your-mysql-user>
  password: ${oc.env:MYSQL_PASSWORD,''}
  database: dw

qdrant:
  host: <your-qdrant-host>
  port: 6333
  embedding_size: 1024

embedding:
  host: <your-embedding-host>
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: <your-es-host>
  port: 9200
  # 字段取值索引，与 ValueESRepository 使用的索引保持一致
  index_name: data-agent-value

recall:
  # 单关键词检索条数：每个字段在库中有 name/description/alias 三条向量，
  # 会重复占用 Top-K 名额，故过采样后再按字段去重（实测 15 条约覆盖 5~8 个不同字段）
  column_search_limit: 15
  # 主外键单独走绝对阈值：键列（region_id/order_id...）语义弱、分数普遍偏低，
  # 若也用相对阈值会被误裁；但它们又是 JOIN 必需、且标注里基本都要用到，
  # 故沿用原来的 0.6 绝对阈值，只让「有业务语义的度量/维度列」参与相对阈值降噪。
  column_key_score_threshold: 0.6
  # 相对阈值：只保留「相似度 >= 本次最高分 × ratio」的字段。
  # 不用绝对阈值的原因：正确字段与噪音字段的绝对分数高度交错（问「销售额」时
  # order_amount 为 1.000，而噪音项 order_quantity 也能到 0.815），
  # 绝对阈值必然同时错杀正确项或放过噪音。取 0.9 是实测分布下的平衡点。
  column_score_ratio: 0.9

llm:
  model_name: deepseek-v4-flash
  # 从环境变量 / 项目根目录 .env 读取，避免密钥入库；未设置时启动会给出告警
  api_key: ${oc.env:DEEPSEEK_API_KEY,''}
  base_url: https://api.deepseek.com
