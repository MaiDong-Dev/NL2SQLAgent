# =============================================================================
# 配置模板：复制为 conf/app_config.yaml 后按自己环境填写（含明文密码）。
#
#   cp conf/app_config.example.yaml conf/app_config.yaml
#
# conf/app_config.yaml 已在 .gitignore 中，密码/密钥写在里面也不会入库，
# 因此这里直接写明文本即可；<...> 部分是必须替换的占位符。
# 若不想把密钥落盘，也可以保留 ${oc.env:...} 写法改从环境变量注入：
#   MYSQL_PASSWORD / DEEPSEEK_API_KEY / OPENROUTER_API_KEY（--judge jev 时用）
# =============================================================================

logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: <your-mysql-host>
  port: 3306
  user: <your-mysql-user>
  password: ${oc.env:MYSQL_PASSWORD,''}
  database: meta

db_dw:
  host: <your-mysql-host>
  port: 3306
  user: <your-mysql-user>
  password: ${oc.env:MYSQL_PASSWORD,''}
  database: dw

qdrant:
  host: <your-qdrant-host>
  port: 6333
  embedding_size: 1024

embedding:
  host: <your-embedding-host>
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: <your-es-host>
  port: 9200
  # 字段取值索引，与 ValueESRepository 使用的索引保持一致
  index_name: data-agent-value

recall:
  # 单关键词检索条数：每个字段在库中有 name/description/alias 三条向量，
  # 会重复占用 Top-K 名额，故过采样后再按字段去重（实测 15 条约覆盖 5~8 个不同字段）
  column_search_limit: 15
  # 主外键单独走绝对阈值：键列（region_id/order_id...）语义弱、分数普遍偏低，
  # 若也用相对阈值会被误裁；但它们又是 JOIN 必需、且标注里基本都要用到，
  # 故沿用原来的 0.6 绝对阈值，只让「有业务语义的度量/维度列」参与相对阈值降噪。
  column_key_score_threshold: 0.6
  # 相对阈值：只保留「相似度 >= 本次最高分 × ratio」的字段。
  # 不用绝对阈值的原因：正确字段与噪音字段的绝对分数高度交错（问「销售额」时
  # order_amount 为 1.000，而噪音项 order_quantity 也能到 0.815），
  # 绝对阈值必然同时错杀正确项或放过噪音。取 0.9 是实测分布下的平衡点。
  column_score_ratio: 0.9

llm:
  model_name: deepseek-v4-flash
  # 从环境变量 / 项目根目录 .env 读取，避免密钥入库；未设置时启动会给出告警
  api_key: ${oc.env:DEEPSEEK_API_KEY,''}
  base_url: https://api.deepseek.com

# SQL 执行护栏：SQL 由 LLM 生成，不可信，这里集中配置兜底参数。
# 三个值都有默认值，整段省略也能正常启动（见 server/conf/app_config.py 的 SQLConfig）。
sql:
  # 单次查询返回给前端的最大行数。5 万单的库上一句没聚合好的 SQL 能返回数万行，
  # 会撑爆内存、拖死前端渲染；超出部分截断并回传 truncated 标记。
  max_result_rows: 1000
  # 单条 SQL 执行超时（秒），超时按失败处理并回传提示，避免拖垮连接池
  execution_timeout_seconds: 30
  # SQL 校验失败后最多让 LLM 修正几次；超过则放弃执行并回传错误，防止无限循环
  max_correction_attempts: 2

# 评测（eval/ 下脚本）使用的外部裁判密钥；不跑评测可不配
eval:
  judge:
    # Jev 裁判（--judge jev/both）经 OpenRouter 决策接口调用所需。
    # 也可以直接写明文本（本文件不入库）；留空则回退环境变量 OPENROUTER_API_KEY。
    openrouter_api_key: ${oc.env:OPENROUTER_API_KEY,''}
